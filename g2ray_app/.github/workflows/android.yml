name: Android CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Check wrapper files
        run: |
          unzip -t gradle/wrapper/gradle-wrapper.jar
          test -x gradlew

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Check pinned libXray source
        shell: pwsh
        run: |
          $properties = ConvertFrom-StringData (Get-Content app/libs/libXray.properties -Raw)
          $ref = $properties["libxray.ref"]
          $buildScript = Get-Content scripts/build-libxray-aar.ps1 -Raw
          if ([string]::IsNullOrWhiteSpace($ref) -or $buildScript -notmatch [regex]::Escape($ref)) {
            throw "The libXray build default must match app/libs/libXray.properties"
          }

      - name: Test, lint, and assemble debug APK
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug
